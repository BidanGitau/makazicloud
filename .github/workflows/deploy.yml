name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-makazicloud-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "::error::VPS_SSH_KEY secret is empty or missing."
            exit 1
          fi

          # Accept either the raw multi-line private key or a base64-encoded key.
          # Strip stray CR because CRLF line endings make OpenSSL reject the key.
          if printf '%s' "${VPS_SSH_KEY}" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "${VPS_SSH_KEY}" | tr -d '\r' > ~/.ssh/vps_deploy_key
          else
            printf '%s' "${VPS_SSH_KEY}" | base64 --decode | tr -d '\r' > ~/.ssh/vps_deploy_key
          fi

          chmod 600 ~/.ssh/vps_deploy_key
          if ! ssh-keygen -y -f ~/.ssh/vps_deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid OpenSSH private key."
            echo "Re-add the secret as the full multi-line key starting with"
            echo "'-----BEGIN OPENSSH PRIVATE KEY-----' (or '-----BEGIN RSA PRIVATE KEY-----'),"
            echo "with newlines preserved, or store base64 output from:"
            echo "base64 -w 0 path/to/private_key"
            echo "PuTTY .ppk format must be converted first via 'puttygen'."
            exit 1
          fi

          if [ -z "${VPS_HOST}" ]; then
            echo "::error::VPS_HOST secret is empty or missing."
            exit 1
          fi
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Sync project to VPS
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_deploy_key" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "apps/*/node_modules/" \
            --exclude "apps/api/dist/" \
            --exclude "apps/web/build/" \
            --exclude "apps/web/.react-router/" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude ".deploy-db-password" \
            --exclude ".DS_Store" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/"

      - name: Deploy on VPS
        shell: bash
        run: |
          ssh -i ~/.ssh/vps_deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_APP_DIR }}' && bash scripts/deploy-production.sh"
